<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        /* stylelint-disable-next-line at-rule-no-unknown */
        @theme {
            --color-glass: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-700 via-blue-600 to-cyan-500 flex items-center justify-center p-6 font-sans">

    <div class="w-full max-w-xl flex flex-col gap-6">

        <!-- Page Title -->
        <div class="text-center">
            <h1 class="text-4xl font-bold text-white drop-shadow-lg tracking-wide">HTML Lists</h1>
            <p class="text-white/70 mt-1 text-sm">A styled demo of ordered & unordered lists</p>
        </div>

        <!-- Unordered List Card -->
        <div class="rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md shadow-xl p-6">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-3 h-3 rounded-full bg-cyan-300 shadow-md shadow-cyan-400"></span>
                <h2 class="text-lg font-semibold text-white">Unordered List <span class="text-white/50 text-sm font-normal">(ul)</span></h2>
            </div>
            <ul class="space-y-2 pl-2">
                <li class="flex items-center gap-3 text-white/90">
                    <span class="w-2 h-2 rounded-full bg-cyan-300 flex-shrink-0"></span>
                    Mangga
                </li>
                <li class="flex items-center gap-3 text-white/90">
                    <span class="w-2 h-2 rounded-full bg-cyan-300 flex-shrink-0"></span>
                    Pisang
                </li>
                <li class="flex items-center gap-3 text-white/90">
                    <span class="w-2 h-2 rounded-full bg-cyan-300 flex-shrink-0"></span>
                    Jambu
                </li>
            </ul>
        </div>

        <!-- Ordered List Card -->
        <div class="rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md shadow-xl p-6">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-3 h-3 rounded-full bg-purple-300 shadow-md shadow-purple-400"></span>
                <h2 class="text-lg font-semibold text-white">Ordered List <span class="text-white/50 text-sm font-normal">(ol)</span></h2>
            </div>
            <ol class="space-y-3 pl-2">
                <li class="flex items-start gap-3 text-white/90">
                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-purple-400/40 border border-purple-300/50 flex items-center justify-center text-xs font-bold text-purple-200">1</span>
                    Buka Github.com
                </li>
                <li class="flex items-start gap-3 text-white/90">
                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-purple-400/40 border border-purple-300/50 flex items-center justify-center text-xs font-bold text-purple-200">2</span>
                    Klik Tombol plus di pojok kanan
                </li>
                <li class="flex items-start gap-3 text-white/90">
                    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-purple-400/40 border border-purple-300/50 flex items-center justify-center text-xs font-bold text-purple-200">3</span>
                    Buat repository
                </li>
            </ol>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/40 text-xs">Powered by Tailwind CSS v4</p>

    </div>

</body>
</html>
